name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare staging app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eux
            APP_PATH=/var/www/sigma-erp-staging
            REPO_URL=https://github.com/sigmaprojects-X/sigma-erp.git

            echo "Checking staging checkout path."
            if [ -e "$APP_PATH" ]; then
              if [ -d "$APP_PATH/.git" ]; then
                echo "Staging path exists and contains a Git checkout."
                git -C "$APP_PATH" rev-parse --is-inside-work-tree
                git -C "$APP_PATH" fetch --depth=1 "$REPO_URL" refs/heads/staging
                git -C "$APP_PATH" reset --hard FETCH_HEAD
              else
                echo "Staging path exists but is not a Git checkout; stopping without modifying it."
                exit 1
              fi
            else
              echo "Staging path does not exist; cloning the staging branch."
              git clone --depth=1 --branch staging "$REPO_URL" "$APP_PATH"
            fi
            mkdir -p "$APP_PATH/public/build"

      - name: Upload staging frontend assets
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "public/build/*"
          target: "/var/www/sigma-erp-staging/public/build"
          strip_components: 2

      - name: Install staging app and migrate isolated database
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAGING_ENV_B64: ${{ secrets.STAGING_ENV_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STAGING_ENV_B64
          script_stop: true
          script: |
            set -eu
            APP_PATH=/var/www/sigma-erp-staging
            ENV_PATH="$APP_PATH/.env"

            test -n "$STAGING_ENV_B64" || { echo "Missing STAGING_ENV_B64 secret."; exit 1; }
            printf '%s' "$STAGING_ENV_B64" | base64 --decode > "$ENV_PATH"
            chmod 640 "$ENV_PATH"

            grep -qx 'APP_ENV=staging' "$ENV_PATH" || { echo "APP_ENV must be staging."; exit 1; }
            grep -qx 'APP_DEBUG=false' "$ENV_PATH" || { echo "APP_DEBUG must be false."; exit 1; }
            grep -qx 'APP_URL=https://test.erp.sigmajayanusantara.biz.id' "$ENV_PATH" || { echo "APP_URL does not match the staging hostname."; exit 1; }
            grep -Eq '^APP_KEY=base64:.+' "$ENV_PATH" || { echo "A unique staging APP_KEY is required."; exit 1; }
            grep -q '^DB_DATABASE=' "$ENV_PATH" || { echo "A separate staging DB_DATABASE is required."; exit 1; }

            PRODUCTION_DB="$(sed -n 's/^DB_DATABASE=//p' /var/www/sigma-erp/.env | head -n 1 | tr -d "\"'")"
            STAGING_DB="$(sed -n 's/^DB_DATABASE=//p' "$ENV_PATH" | head -n 1 | tr -d "\"'")"
            test -n "$PRODUCTION_DB" && test -n "$STAGING_DB" || { echo "Could not verify database names."; exit 1; }
            test "$PRODUCTION_DB" != "$STAGING_DB" || { echo "Staging database must differ from production."; exit 1; }

            cd "$APP_PATH"
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan migrate --force
            if [ ! -L public/storage ]; then
              php artisan storage:link
            fi
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
