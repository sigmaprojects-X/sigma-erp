name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or ref to deploy to the isolated staging environment"
        required: true
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'staging' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare staging app directory
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ inputs.source_ref || 'staging' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_REF
          script_stop: true
          script: |
            set -eu
            APP_PATH=/var/www/sigma-erp-staging
            SOURCE_PATH=/var/www/sigma-erp

            if [ ! -d "$SOURCE_PATH/.git" ]; then
              echo "Production checkout is missing; cannot safely prepare staging source."
              exit 1
            fi

            test -n "$DEPLOY_REF" || { echo "A staging source ref is required."; exit 1; }
            git -C "$SOURCE_PATH" fetch --depth=1 origin "$DEPLOY_REF"
            SOURCE_SHA="$(git -C "$SOURCE_PATH" rev-parse FETCH_HEAD)"

            if [ -d "$APP_PATH/.git" ]; then
              git -C "$APP_PATH" fetch --depth=1 "$SOURCE_PATH" "$SOURCE_SHA"
              git -C "$APP_PATH" reset --hard "$SOURCE_SHA"
            elif [ -e "$APP_PATH" ]; then
              if [ -d "$APP_PATH" ] && [ -z "$(ls -A "$APP_PATH")" ]; then
                git clone --depth=1 --no-checkout "$SOURCE_PATH" "$APP_PATH"
                git -C "$APP_PATH" checkout -B staging "$SOURCE_SHA"
              else
                echo "Staging path exists but is not an empty directory or Git checkout; stopping without modifying it."
                exit 1
              fi
            else
              git clone --depth=1 --no-checkout "$SOURCE_PATH" "$APP_PATH"
              git -C "$APP_PATH" checkout -B staging "$SOURCE_SHA"
            fi
            mkdir -p "$APP_PATH/public/build"

      - name: Upload staging frontend assets
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "public/build/*"
          target: "/var/www/sigma-erp-staging/public/build"
          strip_components: 2

      - name: Install staging app and migrate isolated database
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAGING_ENV_B64: ${{ secrets.STAGING_ENV_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STAGING_ENV_B64
          script_stop: true
          script: |
            set -eu
            APP_PATH=/var/www/sigma-erp-staging
            ENV_PATH="$APP_PATH/.env"

            test -n "$STAGING_ENV_B64" || { echo "Missing STAGING_ENV_B64 secret."; exit 1; }
            printf '%s' "$STAGING_ENV_B64" | base64 --decode > "$ENV_PATH"
            chmod 640 "$ENV_PATH"

            grep -qx 'APP_ENV=staging' "$ENV_PATH" || { echo "APP_ENV must be staging."; exit 1; }
            grep -qx 'APP_DEBUG=false' "$ENV_PATH" || { echo "APP_DEBUG must be false."; exit 1; }
            grep -qx 'APP_URL=https://test.erp.sigmajayanusantara.biz.id' "$ENV_PATH" || { echo "APP_URL does not match the staging hostname."; exit 1; }
            grep -Eq '^APP_KEY=base64:.+' "$ENV_PATH" || { echo "A unique staging APP_KEY is required."; exit 1; }
            grep -q '^DB_DATABASE=' "$ENV_PATH" || { echo "A separate staging DB_DATABASE is required."; exit 1; }

            PRODUCTION_DB="$(sed -n 's/^DB_DATABASE=//p' /var/www/sigma-erp/.env | head -n 1 | tr -d "\"'")"
            STAGING_DB="$(sed -n 's/^DB_DATABASE=//p' "$ENV_PATH" | head -n 1 | tr -d "\"'")"
            test -n "$PRODUCTION_DB" && test -n "$STAGING_DB" || { echo "Could not verify database names."; exit 1; }
            test "$PRODUCTION_DB" != "$STAGING_DB" || { echo "Staging database must differ from production."; exit 1; }

            cd "$APP_PATH"
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan migrate --force
            if [ ! -L public/storage ]; then
              php artisan storage:link
            fi
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
